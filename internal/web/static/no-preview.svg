<!-- 出せる絵が無い写真のタイルに配る。タイルは正方形なので、object-fit: cover で
     切り取られないよう viewBox も正方形にしてある。背景色は app.css のタイル背景に
     揃えてあるが、画像として配るのでCSS変数は使えず、値を直接書いている。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#222"/>
  <g fill="none" stroke="#4d4d4d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="27" y="32" width="46" height="36" rx="4"/>
    <path d="M31 61 L44 48 L53 57 L61 51 L69 59"/>
  </g>
  <circle cx="61" cy="42" r="3.5" fill="#4d4d4d"/>
</svg>
