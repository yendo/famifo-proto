<!-- Served as the tile of a photo that has nothing to show. Tiles are square and
     drawn with object-fit: cover, so the viewBox is square too and nothing gets
     cropped. The background matches the tile background in app.css; the value is
     written out because an image cannot read CSS variables. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>No preview available</title>
  <rect width="100" height="100" fill="#222"/>
  <g fill="none" stroke="#4d4d4d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="27" y="32" width="46" height="36" rx="4"/>
    <path d="M31 61 L44 48 L53 57 L61 51 L69 59"/>
  </g>
  <circle cx="61" cy="42" r="3.5" fill="#4d4d4d"/>
</svg>
