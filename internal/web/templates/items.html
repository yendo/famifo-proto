{{define "items"}}
{{/* id は貼り替えを差分で当てるときの対応付けに使う。これが無いと位置で
     照合され、1行スクロールしただけで全タイルの src が書き換わる。 */}}
{{range .Photos}}
<a class="tile" id="t-{{.ID}}" href="{{.FullURL}}" data-full="{{.FullURL}}" data-date="{{.Date}}">
  <img src="{{.ThumbURL}}" alt="" loading="lazy" decoding="async">
</a>
{{end}}
{{end}}
