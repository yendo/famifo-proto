---
name: Security

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # security-events permission to upload the SARIF results
      security-events: write

    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Leave go-version-input empty. Its default of "stable" reaches
          # setup-go as go-version, which takes precedence over
          # go-version-file, so go.mod would otherwise be ignored.
          # See https://github.com/golang/go/issues/70036
          go-version-input: ""
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
