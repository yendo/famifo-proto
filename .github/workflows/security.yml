---
name: Security

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # security-events permission to upload the SARIF results
      security-events: write

    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Leave go-version-input empty. Its default of "stable" reaches
          # setup-go as go-version, which takes precedence over
          # go-version-file, so go.mod would otherwise be ignored.
          # See https://github.com/golang/go/issues/70036
          go-version-input: ""
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif

      # govulncheck can write the same stack twice in a result and the
      # same tag twice in a rule, which code scanning rejects as invalid
      # SARIF.
      # See https://github.com/golang/go/issues/81953
      # and https://github.com/golang/go/issues/75890
      - name: Fix SARIF for govulncheck bugs
        run: >-
          jq '(.runs[].results[] | select(.stacks) | .stacks) |= unique
          | (.runs[].tool.driver.rules[] | select(.properties.tags)
          | .properties.tags) |= unique'
          govulncheck.sarif > govulncheck-deduped.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: govulncheck-deduped.sarif
          category: govulncheck
